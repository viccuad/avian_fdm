[package]
name = "avian_fdm_j3cub_jsbsim"
version = "0.2.0"
edition = "2021"
description = "J3Cub aircraft preset for avian_fdm derived from github.com/wlbragg/J3Cub"
license = "GPL-3.0-only"
authors = ["Víctor Cuadrado Juan <me@viccuad.me>"]
repository = "https://github.com/viccuad/avian_fdm"
readme = "README.md"
keywords = ["bevy", "avian", "fdm", "flight", "simulation"]
categories = ["game-development", "simulation", "science"]

[features]
default = ["parry-f32", "debug-plugin"]
# These features forward to the avian_fdm features of the same name.
# Enable exactly one of `parry-f32` and `parry-f64`.
f64 = ["avian_fdm/f64"]
parry-f32 = ["avian_fdm/parry-f32"]
parry-f64 = ["f64", "avian_fdm/parry-f64"]
debug-plugin = ["avian_fdm/debug-plugin"]

[dependencies]
# Without default-features = false, the default parry-f32 of avian_fdm stays on
# when this crate enables parry-f64.
avian_fdm = { path = "../", default-features = false }
avian3d = { version = "0.8", default-features = false, features = ["3d"] }
bevy_ecs = { version = "0.20", default-features = false }
bevy_math = { version = "0.20", default-features = false }
bevy_transform = { version = "0.20", default-features = false }

[dev-dependencies]
bevy = { version = "0.20", features = [
    "bevy_winit",
    "bevy_pbr",
    "bevy_gizmos",
    "bevy_dev_tools",
    "render_dev_tools",
] }

[[example]]
name = "j3cub_minimal"

[[example]]
name = "j3cub_visual"
required-features = ["debug-plugin"]
