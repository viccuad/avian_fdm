[package]
name = "avian_fdm"
version = "0.3.0"
edition = "2021"
description = "6-DoF Flight Dynamics Model for Bevy + Avian"
license = "LGPL-3.0-or-later"
authors = ["Víctor Cuadrado Juan <me@viccuad.me>"]
repository = "https://github.com/viccuad/avian_fdm"
homepage = "https://github.com/viccuad/avian_fdm"
documentation = "https://docs.rs/avian_fdm"
readme = "README.md"
keywords = ["bevy", "avian", "fdm", "flight", "simulation"]
categories = ["game-development", "simulation", "science"]
exclude = ["/.github/"]

[workspace]
members = [".", "avian_fdm_j3cub_jsbsim"]

[features]
default = ["parry-f32", "debug-plugin"]
# These features mirror the precision features of avian3d.
#
# The FDM always calculates in f32. `f64` changes only the precision of world
# positions (avian3d `Position`). Use it when bodies move far from the origin.
#
# avian_fdm needs a collider backend. Enable exactly one of `parry-f32` and
# `parry-f64`. `parry-f64` also enables `f64`. For f64, use
# `default-features = false, features = ["parry-f64", "debug-plugin"]`.
f64 = ["avian3d/f64"]
parry-f32 = ["avian3d/parry-f32"]
parry-f64 = ["f64", "avian3d/parry-f64"]
debug-plugin = ["dep:bevy_color", "dep:bevy_gizmos", "dep:bevy_shape"]

[dependencies]
# collider-from-mesh is excluded: avian_fdm uses only analytic shapes (boxes, spheres,
# capsules) for AeroZone colliders. Mesh-based colliders would require AssetPlugin +
# MeshPlugin in headless apps, and are never needed for a flight dynamics library.
avian3d = { version = "0.8", default-features = false, features = ["3d"] }
bevy_app = { version = "0.20", default-features = false }
bevy_ecs = { version = "0.20", default-features = false }
bevy_math = { version = "0.20", default-features = false }
bevy_transform = { version = "0.20", default-features = false }
bevy_reflect = { version = "0.20", default-features = false }
bevy_color = { version = "0.20", default-features = false, optional = true }
bevy_gizmos = { version = "0.20", default-features = false, optional = true }
bevy_shape = { version = "0.20", default-features = false, optional = true }
bevy_log = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
bevy = { version = "0.20", features = [
    "bevy_winit",
    "bevy_pbr",
    "bevy_gizmos",
] }

[package.metadata.docs.rs]
features = ["parry-f32", "debug-plugin"] # same as [features]
rustdoc-args = [
    "--cfg",
    "docsrs",
] # activates any #[cfg_attr(docsrs, doc(cfg(...)))] annotations
